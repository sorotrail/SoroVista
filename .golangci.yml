version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
    - gocritic
    - revive
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - fmt.Fprint
        - fmt.Fprintf
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

# The formatter gate: `golangci-lint run` fails on any file gofmt would
# rewrite, so CI cannot merge misformatted code the way `make lint` alone
# (or a bare `gofmt -l`, which always exits 0) would let through.
formatters:
  enable:
    - gofmt
