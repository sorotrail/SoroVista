name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope; CI only reads repo contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # Same test suite again, this time with TEST_DATABASE_URL set so the
  # store integration tests (internal/store/postgres_test.go) run too
  # instead of skipping.
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovista
          POSTGRES_PASSWORD: sorovista
          POSTGRES_DB: sorovista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovista"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test (with Postgres integration tests)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://sorovista:sorovista@localhost:5432/sorovista?sslmode=disable

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz golden deserializer
        run: go test -fuzz=FuzzGoldenDeserializer -fuzztime=10s ./pkg/fuzz
      - name: Fuzz template interpolation
        run: go test -fuzz=FuzzInterpolate -fuzztime=10s ./pkg/fuzz

  # Renders and lints the Helm chart. Helm must be installed for real: the
  # render tests skip themselves when the binary is absent, and a skipped test
  # looks the same as a passing one in CI output.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Confirm Helm is installed
        run: helm version
      - name: Lint chart
        run: helm lint deploy/helm/sorovista
      - name: Render chart (golden files and config coverage)
        run: go test ./deploy/helm/sorovista/test -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
