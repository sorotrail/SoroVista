name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal token scope; CI only reads repo contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  # The Dockerfile is the documented quickstart path, and it can break
  # without touching a line of Go: ldflags stamps buildinfo by full import
  # path, and the build runs with CGO disabled. Building the image here
  # makes that failure a red pull request instead of a broken deploy.
  #
  # Nothing is pushed: this repository has no registry credentials in CI,
  # and a check runnable from a fork must not gain any.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Non-default values on purpose: a build that silently falls back to
      # the Dockerfile's ARG defaults would still report "dev", "none" and
      # "unknown", so the smoke test below asserts what it stamped.
      - name: Compute build metadata
        id: vars
        run: |
          echo "version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # load: true puts the image in the local daemon so the smoke test can
      # run it. push: false keeps this job free of credentials, which fork
      # pull requests could not read anyway.
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: sorovista:ci
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Upstream mode keeps this hermetic: it opens no database, so the
      # container starts with no services. The indexer URL deliberately
      # points at a closed port, so /health must answer 503 — which still
      # proves the entrypoint, config and HTTP server work.
      - name: Smoke test the image
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          DATE: ${{ steps.vars.outputs.date }}
        run: |
          set -o pipefail
          docker run -d --name sorovista-smoke --rm -p 18080:8080 \
            -e SOURCE_MODE=sorotrail \
            -e SOROTRAIL_URL=http://127.0.0.1:9 \
            -e HTTP_ADDR=:8080 \
            sorovista:ci
          trap 'docker rm -f sorovista-smoke >/dev/null 2>&1 || true' EXIT

          OUT=""
          for _ in $(seq 1 50); do
            if OUT=$(curl -sf http://127.0.0.1:18080/api/version); then
              break
            fi
            sleep 0.2
          done
          if [ -z "$OUT" ]; then
            echo "container never answered /api/version"
            docker logs sorovista-smoke
            exit 1
          fi
          echo "GET /api/version -> $OUT"
          test "$(echo "$OUT" | jq -r '.version')" = "$VERSION"
          test "$(echo "$OUT" | jq -r '.commit')" = "$COMMIT"
          test "$(echo "$OUT" | jq -r '.build_date')" = "$DATE"

          CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:18080/health)
          echo "GET /health -> $CODE"
          cat /tmp/health.json
          test "$CODE" = "503"
          jq -e '.mode == "sorotrail" and .healthy == false' /tmp/health.json

  # Same test suite again, this time with TEST_DATABASE_URL set so the
  # store integration tests (internal/store/postgres_test.go) run too
  # instead of skipping.
  test-db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sorovista
          POSTGRES_PASSWORD: sorovista
          POSTGRES_DB: sorovista
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sorovista"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test (with Postgres integration tests)
        # pipefail keeps go test's exit status when its output is tee'd for the
        # coverage report below.
        run: |
          set -o pipefail
          go test -coverprofile=coverage.out ./... | tee go-test-output.txt
        env:
          TEST_DATABASE_URL: postgres://sorovista:sorovista@localhost:5432/sorovista?sslmode=disable

      # Coverage is reported from this job rather than the build job because
      # only here do the internal/store integration tests run; a figure from
      # the no-database job would understate the store by about 60 points and
      # read as a regression on every pull request. Per-package figures are
      # included because the total moves slowly and hides uneven packages.
      # There is deliberately no coverage threshold gate yet: until the
      # zero-coverage packages are addressed it would either block every pull
      # request or be set low enough to mean nothing.
      - name: Report coverage
        run: |
          {
            echo '## Test coverage'
            echo ''
            echo 'From the `test-db` job, which sets `TEST_DATABASE_URL` so the'
            echo '`internal/store` integration tests run instead of skipping.'
            echo ''
            echo '### Per package'
            echo ''
            echo '```'
            # With -coverprofile, go test also lists packages that have no
            # tests (cmd/sorovista and internal/source today) without an "ok"
            # prefix, so both line shapes are normalised here.
            awk '/coverage: [0-9.]+% of statements/ {
                   line = $0
                   sub(/^ok[ \t]+/, "", line)
                   sub(/^[ \t]+/, "", line)
                   sub(/^github\.com\/sorotrail\/sorovista\/?/, "", line)
                   sub(/[ \t]+[0-9.]+s[ \t]+coverage: /, " ", line)
                   sub(/[ \t]+coverage: /, " ", line)
                   print line
                 }' go-test-output.txt
            echo '```'
            echo ''
            echo '### Total'
            echo ''
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Fuzz golden deserializer
        run: go test -fuzz=FuzzGoldenDeserializer -fuzztime=10s ./pkg/fuzz
      - name: Fuzz template interpolation
        run: go test -fuzz=FuzzInterpolate -fuzztime=10s ./pkg/fuzz

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
