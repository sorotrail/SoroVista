# SoroVista Helm values.
#
# The chart deploys one of SoroVista's two operating modes, selected by
# `sourceMode`. Settings that only apply to the other mode are omitted from
# the rendered manifests rather than emitted as empty strings.
#
#   rpc        standalone: SoroVista polls Stellar RPC and stores events in
#              Postgres. Needs `database.url` or `database.existingSecret`.
#   sorotrail  upstream: reads an existing SoroTrail indexer's API. Stateless;
#              needs `sorotrailUrl` and no database.

# One replica by default. In rpc mode each replica runs its own ingester
# against the same RPC endpoint: writes are idempotent, but every extra
# replica multiplies RPC load and races the startup migrations. Scale rpc mode
# only after moving migrations and ingestion to a single writer. sorotrail
# mode is stateless and can be scaled freely.
replicaCount: 1

image:
  # No release pipeline exists yet, so this points at the project's GHCR
  # namespace; an empty tag falls back to Chart.appVersion. See
  # https://github.com/sorotrail/sorovista/issues (release pipeline).
  repository: ghcr.io/sorotrail/sorovista
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image already runs as a non-root user; these values make that explicit
# and keep the container from writing to its own filesystem.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

# --- Application configuration ----------------------------------------------
# Each key maps to the environment variable of the same name after the chart's
# naming (documented in .env.example). The environment coverage test fails if
# internal/config reads a variable that this chart cannot set.

# rpc or sorotrail.
sourceMode: rpc

httpAddr: ":8080"
logLevel: info
# Comma-separated browser Origins allowed to call the API. Empty omits the
# variable, which disables CORS.
corsAllowedOrigins: ""
rateLimitRPS: 0
rateLimitBurst: 0
# Only enable behind a proxy that overwrites X-Forwarded-For.
rateLimitTrustedProxy: false
# Tracing is opt-in. The endpoint, sample rate, and service name are ignored
# while otelEnabled is false.
otelEnabled: false
otelEndpoint: http://localhost:4318
otelSampleRate: 0.1
otelServiceName: sorovista

# --- Standalone (sourceMode=rpc) only ----------------------------------------

# testnet, mainnet, futurenet or custom. The passphrase identifies the
# network; SoroVista refuses to start if the RPC endpoint belongs to another.
network: testnet
# Overrides the network preset. Empty uses the preset endpoint.
rpcUrl: ""
# Overrides the network preset passphrase (required for network=custom).
networkPassphrase: ""
pollInterval: 5s
# Comma-separated contract IDs. Empty ingests every contract event.
watchedContracts: ""
# Force a cold start from this ledger. Empty reaches back retentionLedgers.
startLedger: ""
# Cold-start reach-back in ledgers (~24h at 5s per ledger).
retentionLedgers: 17280

database:
  # Connection string, including any password. It is rendered into a Secret,
  # never a ConfigMap. Set exactly one of url or existingSecret.
  url: ""
  # Reference an existing Secret instead of letting the chart create one.
  existingSecret: ""
  existingSecretKey: database-url

# --- Upstream (sourceMode=sorotrail) only ------------------------------------

# Base URL of the SoroTrail indexer, e.g. http://sorotrail:8080.
sorotrailUrl: ""

# --- Probes ------------------------------------------------------------------
# /livez deliberately checks nothing so a dead backend cannot trigger a
# restart loop; /readyz consults the event source. Do not point both at the
# same endpoint.
livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

# --- Scheduling --------------------------------------------------------------

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Off by default. With the default one replica, minAvailable: 1 prevents
# voluntary evictions, so only enable this when running more than one replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Prometheus Operator ServiceMonitor. Off by default because it requires the
# monitoring.coreos.com/v1 CRDs to be installed.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels for Prometheus selection, e.g. release: kube-prometheus-stack.
  labels: {}
