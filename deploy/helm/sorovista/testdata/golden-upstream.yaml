# Source: sorovista/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorovista
  labels:
    helm.sh/chart: sorovista-0.1.0
    app.kubernetes.io/name: sorovista
    app.kubernetes.io/instance: sorovista
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sorovista
      app.kubernetes.io/instance: sorovista
  template:
    metadata:
      annotations:
        # Roll pods when the rendered configuration changes.
        checksum/config: 1bc2998da053841837e1e8cfca23015c64cbc5b3a1075de796ca0b3c224ca4a1
      labels:
        app.kubernetes.io/name: sorovista
        app.kubernetes.io/instance: sorovista
    spec:
      serviceAccountName: sorovista
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: sorovista
          image: "ghcr.io/sorotrail/sorovista:0.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sorovista
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 12
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
